name: Test daily builds

on:
  schedule:
  - cron: "0 5 * * *"

jobs:
  test-daily-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nextcloud
        run: sudo snap install --edge nextcloud

      - name: Setup ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          working-directory: tests
          bundler-cache: true

      - name: Run tests
        working-directory: tests
        run: bundle exec ./run-tests.sh integration

  test-daily-v32:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nextcloud
        run: sudo snap install nextcloud --channel=32/edge

      - name: Setup ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          working-directory: tests
          bundler-cache: true

      - name: Run tests
        working-directory: tests
        run: bundle exec ./run-tests.sh integration
  
  test-daily-v33:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nextcloud
        run: sudo snap install nextcloud --channel=33/edge

      - name: Setup ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          working-directory: tests
          bundler-cache: true

      - name: Run tests
        working-directory: tests
        run: bundle exec ./run-tests.sh integration

  # Run the Pebble-based ACME test on arm64 to catch architecture-specific
  # regressions in the`nextcloud.enable-https` stack.
  # For example #3461.
  test-daily-arm64:
    strategy:
      fail-fast: false
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nextcloud
        run: sudo snap install nextcloud --channel=latest/beta

      - name: Setup ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          working-directory: tests
          bundler-cache: true
      
      - name: Install Chrome
        run: |
          if ! command -v google-chrome > /dev/null; then
            wget --quiet https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
            sudo apt-get install -y ./google-chrome-stable_current_arm64.deb
          fi

      - name: Run tests
        working-directory: tests
        env:
          TEST: integration/enable_https_spec.rb
        run: bundle exec ./run-tests.sh integration